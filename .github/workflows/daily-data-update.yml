name: Daily data update

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC. Avoid top-of-hour congestion.
    - cron: "17 0 * * *" # 09:17 KST
    - cron: "47 8 * * *" # 17:47 KST

permissions:
  contents: write

concurrency:
  group: healtharchive-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Sync latest master
        run: git pull --ff-only origin master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore protected radar history
        env:
          PROTECTED_UPDATE_TOKEN: ${{ secrets.PROTECTED_UPDATE_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${PROTECTED_UPDATE_TOKEN}" \
            https://api.healtharchive.kr/admin/protected/radar-log \
            -o data/radar_log.json || printf '[]\n' > data/radar_log.json

      - name: Restore protected funding tracker
        env:
          PROTECTED_UPDATE_TOKEN: ${{ secrets.PROTECTED_UPDATE_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${PROTECTED_UPDATE_TOKEN}" \
            https://api.healtharchive.kr/admin/protected/funding-opportunities \
            -o data/funding_opportunities.json || printf '{"version":1,"lastSuccessfulSync":null,"sources":[],"items":[]}\n' > data/funding_opportunities.json

      - name: Run scheduled update scripts
        id: collectors
        env:
          FOOD_SAFETY_KOREA_API_KEY: ${{ secrets.FOOD_SAFETY_KOREA_API_KEY }}
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
        run: |
          set +e
          scripts=(
            scripts/update_ingredients.py
            scripts/update_minutes.py
            scripts/update_products.py
            scripts/update_temp_approval.py
            scripts/update_news.py
            scripts/update_news_kfri.py
            scripts/update_news_mfds.py
            scripts/update_news_nutraingredients.py
            scripts/update_news_supplysidesj.py
            scripts/update_news_nutritioninsight.py
            scripts/update_news_sciencedaily.py
            scripts/update_news_yakup.py
            scripts/update_paper_reports.py
            scripts/update_funding_opportunities.py
          )

          failed_scripts=()
          total_count=${#scripts[@]}
          for script in "${scripts[@]}"; do
            echo "::group::${script}"
            python "$script"
            code=$?
            echo "::endgroup::"
            if [ "$code" -ne 0 ]; then
              echo "::warning::${script} failed with exit code ${code}"
              failed_scripts+=("${script}")
              python scripts/mark_update_failure.py "$script"
            fi
          done

          python scripts/generate_public_content.py
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::warning::scripts/generate_public_content.py failed with exit code ${code}"
            failed_scripts+=("scripts/generate_public_content.py")
          fi

          python scripts/generate_mobile_digest.py
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::warning::scripts/generate_mobile_digest.py failed with exit code ${code}"
            failed_scripts+=("scripts/generate_mobile_digest.py")
          fi

          python scripts/build_recent_news.py
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::warning::scripts/build_recent_news.py failed with exit code ${code}"
            failed_scripts+=("scripts/build_recent_news.py")
          fi

          failed_names="$(IFS=,; echo "${failed_scripts[*]}")"
          echo "failed_count=${#failed_scripts[@]}" >> "$GITHUB_OUTPUT"
          echo "failed_names=${failed_names}" >> "$GITHUB_OUTPUT"
          echo "total_count=${total_count}" >> "$GITHUB_OUTPUT"

      - name: Update protected radar data
        env:
          PROTECTED_UPDATE_TOKEN: ${{ secrets.PROTECTED_UPDATE_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer ${PROTECTED_UPDATE_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @data/radar_log.json \
            https://api.healtharchive.kr/admin/protected/radar-log

      - name: Upload new committee minutes PDFs
        env:
          PROTECTED_UPDATE_TOKEN: ${{ secrets.PROTECTED_UPDATE_TOKEN }}
        run: |
          shopt -s nullglob
          for file in minutes-pdfs/*.pdf; do
            name="$(basename "$file")"
            encoded="$(python -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$name")"
            curl --fail --silent --show-error \
              -X PUT \
              -H "Authorization: Bearer ${PROTECTED_UPDATE_TOKEN}" \
              -H "Content-Type: application/pdf" \
              --data-binary "@$file" \
              "https://api.healtharchive.kr/admin/protected/minutes-pdf/${encoded}"
          done

      - name: Update protected funding tracker
        env:
          PROTECTED_UPDATE_TOKEN: ${{ secrets.PROTECTED_UPDATE_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer ${PROTECTED_UPDATE_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @data/funding_opportunities.json \
            https://api.healtharchive.kr/admin/protected/funding-opportunities

      - name: Commit updated data
        run: |
          git config user.name "healtharchive2026-kr"
          git config user.email "healtharchive2026@gmail.com"

          git add -f data/*.js data/*.json minutes-pdfs/*.txt insights/*.html insights/weekly/*.html sitemap.xml
          git reset -- data/products_archive.json data/food_ingredients_raw.json data/ingredients_full.json data/radar_log.json data/funding_opportunities.json || true
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "Auto-update daily data"

          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "::warning::push rejected, retrying with rebase (attempt ${i})"
            git fetch origin
            if ! git rebase origin/master; then
              git rebase --abort || true
              echo "::error::Generated daily data conflicted with a newer master update."
              exit 1
            fi
          done
          echo "::error::Unable to push generated daily data after 5 attempts."
          exit 1

      - name: Validate scheduled update
        if: always()
        env:
          FAILED_COUNT: ${{ steps.collectors.outputs.failed_count }}
          FAILED_NAMES: ${{ steps.collectors.outputs.failed_names }}
          TOTAL_COUNT: ${{ steps.collectors.outputs.total_count }}
        run: |
          failed=0

          if [ "${FAILED_COUNT:-0}" -ne 0 ]; then
            echo "::warning::Partial collector failures: ${FAILED_NAMES}"
          fi

          threshold=$(( (${TOTAL_COUNT:-14} + 1) / 2 ))
          if [ "${FAILED_COUNT:-0}" -ge "$threshold" ]; then
            echo "::error::A majority of scheduled collectors failed."
            failed=1
          fi

          python scripts/validate_update_status.py || failed=1
          exit "$failed"
